<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Pribadi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface2: #1a1a1a;
  --border: #222222;
  --green: #00ff88;
  --green-dim: rgba(0,255,136,0.06);
  --text: #e8e8e8;
  --muted: #666;
  --radius: 12px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.8rem 1.2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--green-dim);
  border: 1.5px solid var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
.brand-name { font-size: 0.9rem; font-weight: 600; }
.brand-status { font-size: 0.7rem; color: var(--green); display: flex; align-items: center; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

.clear-btn {
  background: none; border: 1px solid var(--border);
  color: var(--muted); font-size: 0.72rem;
  font-family: 'Inter', sans-serif;
  padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s;
}
.clear-btn:hover { border-color: #ff4444; color: #ff4444; }

#chat-area {
  flex: 1; overflow-y: auto;
  padding: 1.2rem;
  display: flex; flex-direction: column; gap: 1rem;
  scroll-behavior: smooth;
}
#chat-area::-webkit-scrollbar { width: 4px; }
#chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg { display: flex; gap: 10px; animation: fadeUp 0.2s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; flex-shrink: 0; margin-top: 2px;
}
.msg.ai .msg-avatar { background: var(--green-dim); border: 1px solid var(--green); }
.msg.user .msg-avatar { background: #1a1a2e; border: 1px solid #4444aa; }

.msg-bubble {
  max-width: 78%; padding: 0.75rem 1rem;
  border-radius: var(--radius);
  font-size: 0.88rem; line-height: 1.75; word-break: break-word;
}
.msg.user .msg-bubble {
  background: #1a2a1a; border: 1px solid rgba(0,255,136,0.2);
  color: #c8ffc8; border-bottom-right-radius: 4px;
}
.msg.ai .msg-bubble {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-bottom-left-radius: 4px;
}
.msg-bubble code {
  background: #050505; border: 1px solid #2a2a2a; border-radius: 4px;
  padding: 1px 5px; font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem; color: var(--green);
}
.msg-bubble pre {
  background: #050505; border: 1px solid #2a2a2a; border-radius: 8px;
  padding: 0.8rem; overflow-x: auto; margin: 0.6rem 0;
}
.msg-bubble pre code { background: none; border: none; padding: 0; color: #a8ffc8; }
.msg-bubble strong { color: #fff; }
.msg-bubble ul, .msg-bubble ol { padding-left: 1.2rem; margin: 0.4rem 0; }
.msg-bubble li { margin: 0.2rem 0; }

.typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--green);
  animation: bounce 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { opacity:0.3; transform:scale(0.8); } 40% { opacity:1; transform:scale(1); } }

.welcome { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.welcome .icon { font-size: 2.5rem; margin-bottom: 1rem; }
.welcome h2 { font-size: 1.1rem; color: var(--text); margin-bottom: 0.5rem; }
.welcome p { font-size: 0.82rem; line-height: 1.6; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 1.2rem; }
.chip {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 0.75rem; padding: 6px 12px;
  border-radius: 20px; cursor: pointer; transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}
.chip:hover { border-color: var(--green); color: var(--green); }

.input-area {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 0.8rem 1rem;
  padding-bottom: calc(0.8rem + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
}
.input-wrap {
  display: flex; gap: 8px; align-items: flex-end;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0.5rem 0.5rem 0.5rem 1rem;
  transition: border-color 0.2s;
}
.input-wrap:focus-within { border-color: rgba(0,255,136,0.3); }
textarea {
  flex: 1; background: none; border: none; color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 0.88rem;
  resize: none; outline: none; max-height: 120px; line-height: 1.5; padding: 4px 0;
}
textarea::placeholder { color: var(--muted); }
.send-btn {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--green); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 0.2s, transform 0.1s;
  color: #000; font-size: 1rem;
}
.send-btn:hover { opacity: 0.85; }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.input-hint { text-align: center; font-size: 0.65rem; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="avatar">🤖</div>
    <div>
      <div class="brand-name">AI Pribadi</div>
      <div class="brand-status"><span class="dot"></span> Online</div>
    </div>
  </div>
  <button class="clear-btn" onclick="clearChat()">🗑 Hapus Chat</button>
</header>

<div id="chat-area">
  <div class="welcome" id="welcome">
    <div class="icon">✨</div>
    <h2>Halo! Aku AI Pribadi kamu</h2>
    <p>Tanya apa saja — coding, sains, cerita,<br>ide, bahasa, matematika, dan lainnya.</p>
    <div class="chips">
      <button class="chip" onclick="suggest('Jelaskan cara kerja AI secara sederhana')">🧠 Cara kerja AI</button>
      <button class="chip" onclick="suggest('Buatkan kode Python kalkulator sederhana')">💻 Kode Python</button>
      <button class="chip" onclick="suggest('Ceritakan satu lelucon lucu')">😄 Lelucon</button>
      <button class="chip" onclick="suggest('Apa ibukota negara-negara ASEAN?')">🌏 Trivia ASEAN</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="inp" placeholder="Ketik pertanyaanmu..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMsg()">➤</button>
  </div>
  <div class="input-hint">Enter kirim • Shift+Enter baris baru</div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────
const GROQ_API_KEY = "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";
const MODEL = "llama3-70b-8192"; // model gratis terbaik dari Groq
const SYSTEM_PROMPT = `Kamu adalah asisten AI pribadi yang pintar, ramah, dan helpful. 
Kamu bisa menjawab pertanyaan tentang apa saja dalam bahasa Indonesia maupun Inggris.
Jawab dengan jelas, informatif, dan gunakan format yang mudah dibaca.`;
// ───────────────────────────────────────────────────────────────

let history = [];
let loading = false;

// Load saved history
try {
  const saved = localStorage.getItem('ai-history');
  if (saved) {
    history = JSON.parse(saved);
    history.forEach(m => addBubble(m.role === 'user' ? 'user' : 'ai', m.content, false));
    if (history.length) document.getElementById('welcome').style.display = 'none';
  }
} catch(e) {}

function save() {
  try { localStorage.setItem('ai-history', JSON.stringify(history.slice(-40))); } catch(e) {}
}

function clearChat() {
  if (!confirm('Hapus semua riwayat chat?')) return;
  history = [];
  try { localStorage.removeItem('ai-history'); } catch(e) {}
  location.reload();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function suggest(text) {
  document.getElementById('inp').value = text;
  sendMsg();
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmt(text) {
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) =>
    `<pre><code>${c.replace(/</g,'&lt;').replace(/>/g,'&gt;').trim()}</code></pre>`);
  text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  text = text.replace(/^### (.+)$/gm, '<strong>$1</strong>');
  text = text.replace(/^## (.+)$/gm, '<strong>$1</strong>');
  text = text.replace(/^- (.+)$/gm, '• $1');
  text = text.replace(/\n/g, '<br>');
  return text;
}

function addBubble(role, text, anim = true) {
  const w = document.getElementById('welcome');
  if (w) w.style.display = 'none';
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (!anim) div.style.animation = 'none';
  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
    <div class="msg-bubble">${role === 'ai' ? fmt(text) : escHtml(text).replace(/\n/g,'<br>')}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function showTyping() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">🤖</div>
    <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMsg() {
  if (loading) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;

  inp.value = ''; inp.style.height = 'auto';
  loading = true;
  document.getElementById('send-btn').disabled = true;

  addBubble('user', text);
  history.push({ role: 'user', content: text });
  save();
  showTyping();

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...history.slice(-20)
        ],
        max_tokens: 2048,
        temperature: 0.7,
        stream: false
      })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const reply = data.choices[0].message.content;

    removeTyping();
    addBubble('ai', reply);
    history.push({ role: 'assistant', content: reply });
    save();

  } catch(err) {
    removeTyping();
    addBubble('ai', '⚠️ Gagal menghubungi AI. Periksa koneksi internet atau API key kamu.');
    console.error(err);
  }

  loading = false;
  document.getElementById('send-btn').disabled = false;
  inp.focus();
}
</script>
</body>
</html>
